# 建模（protocol §6-7）
modeling:
  seed: 12345
  cv_folds: 5
  class_weight: "balanced"
  calibration: "isotonic_oof"
  primary_metric: "AUPRC"
  bootstrap_resamples: 1000
  bootstrap_level: "patient"       # SIS 为 PID 级单记录，仍按患者级报告
  # 预测锚点（protocol §4 v0.2 新增）：Intubation 主锚，缺失时 Surgery_start 兜底（代理 18.0%）
  # ✅ 作者签字冻结 2026-10-20（Yongxin Yang）。
  anchor_event: "Intubation"
  anchor_fallback: "Surgery_start"

# 运行环境
runtime:
  python: "C:/Users/Administrator/.workbuddy/binaries/python/envs/default/Scripts/python.exe"
  pandas: "2.3.3"
  numpy: "2.4.6"
