# 中心配置 — 方向 01 SIS IOH 预测
# 所有脚本从这里读参数；禁止在脚本内硬编码路径/阈值/种子
project:
  name: "SIS术中低血压预测"
  direction_id: "01"
  author: "Yongxin Yang"
  orcid: "0009-0004-9698-6552"
  created: "2026-10-19"
  protocol_version: "v0.2-draft"   # v0.2 = Round1 审查 P0 修复后；建模前必须冻结

# 工作区根（相对本文件定位，脚本启动时自动解析）
paths:
  workspace_root: "../../"        # D:/2026.10/Mover数据库
  sis_emr_dir: "../../data_raw/_sis_emr_x/EMR"
  sis_vitals_flat: "../../data_raw/sis_vitals.csv"
  results_dir: "results"          # 相对项目根（directions/01_.../results）
  review_dir: "review"

# 数据文件
inputs:
  patient_information: "patient_information.csv"
  patient_vitals: "patient_vitals.csv"
  patient_observations: "patient_observations.csv"
  patient_ventilator: "patient_ventilator.csv"
  patient_medication: "patient_medication.csv"
  patient_labs: "patient_labs.csv"
  patient_input_output: "patient_input_output.csv"
  patient_procedure_events: "patient_procedure_events.csv"
  patient_a_line: "patient_a_line.csv"

# 队列规则（protocol §2）
cohort:
  min_age: 18
  min_or_window_minutes: 60        # OR 窗口内 1-min 观测下限
  max_or_window_minutes: 1440      # v1.1.0 新增：OR 窗口上界（0<or_min<=1440，剔除脏时间戳）

# 结局定义（protocol §3 敏感性矩阵）
# type 取值（v1.1.0 引擎支持）：
#   sustained_grid     —— 1-min 网格上连续 >=minutes 分钟 <threshold（NaN 计为中断）【主口径】
#   sustained_measured —— 仅在已测量分钟上判 run（会高估；仅用于量化点测数据下持续事件不可判定的程度）
#   point_burst        —— >=n_points 次低值测量落在 window_minutes 内（NIBP 点测可算口径）
#   exposure_fraction  —— >=min_measurements 次测量且低值占比 >=fraction（把点测转为"暴露比例"）
#   any_below          —— 任一记录分钟低于阈值
outcomes:
  # Round 1 审查建议值；原 O2（MAP<55>=5min）在网格法下仅 60 事件，不可用作主结局。
  # ✅ 作者签字冻结 2026-10-20（Yongxin Yang）：主结局 = D1（≥10 次 MAP 测量且 <65 占比 ≥30%）。
  primary_id: "D1"
  definitions:
    # ---- MAP 维度：持续型（网格法，NaN=中断）----
    O1: {type: sustained_grid, signal: "MAP", threshold: 55, minutes: 5, gap_tolerance: 0}
    O2: {type: sustained_grid, signal: "MAP", threshold: 55, minutes: 5, gap_tolerance: 1}
    O3: {type: sustained_grid, signal: "MAP", threshold: 55, minutes: 10, gap_tolerance: 1}
    O4: {type: sustained_grid, signal: "MAP", threshold: 65, minutes: 10, gap_tolerance: 1}
    # ---- MAP 维度：点测爆发型（NIBP 可算）----
    B1: {type: point_burst, signal: "MAP", threshold: 65, n_points: 3, window_minutes: 30}
    B2: {type: point_burst, signal: "MAP", threshold: 65, n_points: 5, window_minutes: 60}
    B3: {type: point_burst, signal: "MAP", threshold: 55, n_points: 3, window_minutes: 30}
    # ---- MAP 维度：暴露比例型（Round 1 推荐主结局族）----
    D1: {type: exposure_fraction, signal: "MAP", threshold: 65, min_measurements: 10, fraction: 0.30}
    D2: {type: exposure_fraction, signal: "MAP", threshold: 55, min_measurements: 10, fraction: 0.30}
    # ---- MAP 维度：任一记录低于阈值 ----
    E1: {type: any_below, signal: "MAP", threshold: 55}
    E2: {type: any_below, signal: "MAP", threshold: 65}
    # ---- SpO2 维度（覆盖率 96%，网格法与原口径一致）----
    O5: {type: sustained_grid, signal: "SpO2", threshold: 90, minutes: 2, gap_tolerance: 0}
    O6: {type: sustained_grid, signal: "SpO2", threshold: 92, minutes: 5, gap_tolerance: 0}
    # ---- 敏感性口径：仅已测量分钟判 run（已知会高估，仅用于说明点测结构限制）----
    S1: {type: sustained_measured, signal: "MAP", threshold: 65, minutes: 10, gap_tolerance: 1}

# 预测窗（protocol §4）
prediction:
  early_window_minutes: 15         # 诱导后前 15 min 生理作预测因子（特征截断窗 = [anchor-15min, anchor]）
  # 结局标签窗为锚点后至 OR_end（中位 147 min），由 s1_labels_postanchor.csv 提供；
  # horizon_minutes 仅作设计意图记录，未被结局引擎消费（引擎按 outcome_source=post_anchor 取全段）。
  horizon_minutes: 60

# 时间切分（protocol §5）
temporal_split:
  train_start: "2015-11-01"
  train_end: "2017-12-31"
  test_start: "2018-01-01"
  test_end: "2018-10-03"           # 实测数据上界

# 特征工程（protocol §4；s2 消费）
features:
  window_minutes: 15                # 预测窗 = [anchor-15min, anchor]，全部特征须早于 anchor
  outcome_source: "post_anchor"     # 建模标签一律取锚点后窗口（s1_labels_postanchor.csv）
  # 手术分组关键词（冻结 2026-10-19；✅ 作者签字冻结 2026-10-20；由 a6_procedure_groups.py 迭代至 OTHER=2.48%）
  # 用法：文本小写+非字母数字转空格后，按本表顺序做"首个命中"匹配；
  #       仍未命中者走受控模糊兜底（编辑距离<=1、首字符相同、词长>=7），命中日志落
  #       results/s2_fuzzy_match_log.csv；再未命中记 OTHER。
  # 顺序即优先级：先专后泛，复合词优先于单词。NEURO 含脊柱手术（脊柱在 IOH 风险上
