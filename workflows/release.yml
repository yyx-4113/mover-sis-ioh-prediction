name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax-check pipeline scripts
        run: |
          python -m py_compile scripts/*.py scripts/audit/*.py
      - name: Validate config YAML parses
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('config/config.yaml')); print('config.yaml OK')"
